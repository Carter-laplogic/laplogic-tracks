# Cloudflare Worker: the upload service (see ../README.md, "Deploying the upload service").
name = "laplogic-tracks"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
GITHUB_REPO = "Carter-laplogic/laplogic-tracks"   # owner/repo of this repository
GITHUB_BRANCH = "main"
UPLOADS_PER_HOUR = "10"                         # per address, with the RATE_LIMIT namespace below

# Lap Logic uses https://laplogic-tracks.laplogic.workers.dev. For tracks.laplogic.co instead
# (laplogic.co's DNS must be on Cloudflare first), uncomment this, deploy, and change Lap Logic's
# PublicTrackDb.DefaultServiceUrl:
# routes = [{ pattern = "tracks.laplogic.co", custom_domain = true }]

# Upload rate limit: npx wrangler kv namespace create RATE_LIMIT, then paste its id here.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "..."

# The GitHub token is a secret, never in this file: npx wrangler secret put GITHUB_TOKEN
